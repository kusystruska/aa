<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>링크 버튼</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #efefef;
      font-family: sans-serif;
      text-align: center;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    .link-btn img {
      width: 350px;   /* 원하는 크기로 변경 가능 */
      max-width: 100%;
      transition: 0.2s;
      cursor: pointer;
    }

    .link-btn img:hover {
      transform: scale(1.03);
    }
  </style>
</head>

<body>

  <div class="button-wrap">

    <!-- 텔레그램 버튼 -->
    <a class="link-btn"
       href="https://t.me/여기에텔레그램링크"
       target="_blank">
      <img src="텔레2.png" alt="텔레그램 연결">
    </a>

    <!-- 카카오톡 버튼 -->
    <a class="link-btn"
       href="https://open.kakao.com/o/여기에카톡링크"
       target="_blank">
      <img src="카톡2.png" alt="카카오톡 연결">
    </a>

  </div>

</body>
</html>
